<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" href="assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/favoris.css">
    <title>Favoris - Visuora</title>
</head>
<body>
    <header class="flex-around">

        <div class="flex-center hamburger-container">
            <label class="burger" for="burger">
                <input type="checkbox" id="burger">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <a href="index.html" class="flex-center-y logo" title="Accueil">
                <img src="assets/icons/eye.svg" class="icone" alt="icône d'un oeil">
                Visuora
            </a>
        </div>

        <label for="burger" class="menu-overlay" aria-label="Fermer le menu"></label>

        <nav class="navbar">
            <ul class="flex-around navbar-link">
                <li>
                    <a href="index.html" title="Accueil">
                        <img src="assets/icons/house.svg" class="icone" alt="icône d'une maison">    
                        Accueil
                    </a>
                </li>
                <li>
                    <a href="explorer.html" title="Explorer">
                        <img src="assets/icons/compass.svg" class="icone" alt="icône d'une boussole">
                        Explorer
                    </a>
                </li>
                <li>
                    <a href="favoris.html" aria-current="page" title="Favoris">
                        <img src="assets/icons/heart.svg" class="icone" alt="icône d'un coeur">
                        Favoris
                    </a>
                </li>
            </ul>
        </nav>

        <!-- changement de theme  -->
        <div class="toggle-switch">
            <label class="switch-label">
                <input type="checkbox" class="checkbox">
                <span class="slider"></span>
            </label>
        </div>  
    </header>

    <main>
        <section aria-labelledby="favoris-title">
            <div class="flex-around text-container">
                <div class="favoris-text">
                    <h2 id="favoris-title">FAVORIS</h2>
                    <p>Enregistrés sur cet appareil.</p>
                </div>
                <span class="favoris-count actif text-center">0 médias</span>
            </div>

            <div class="container-btn m-90">
                <button type="button" class="btn actif">Tout</button>
                <button type="button" class="btn">Photos</button>
                <button type="button" class="btn">Illustrations</button>
                <button type="button" class="btn">Vidéos</button>
            </div>
        </section>
        <section class="favoris">
            <div class="filter-fav flex-between">
                <select name="favoris filtre" id="select-wrapper">
                    <option value="recent">Récemment ajoutés</option>
                    <option value="ancien">Ancien</option>
                </select>
                <button type="button" class="btn" id="btn-clean">Tout effacer</button>
            </div>
            <div class="gallery">
                <div class="gallery-image"></div>
            </div>
        </section>
        <section class="add-favoris text-center">
            <h2>Continuez à explorer.</h2>
            <p>Chaque favoris ajoute une image ici.</p>
            <a href="explorer.html" title="Explorer" class="btn btn-search">Continuer à explorer</a>
        </section>
    </main>
</body>
</html>
